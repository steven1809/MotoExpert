
server {
    listen 80;
    server_name motoexpert.proyectoscampus.top;

    # Redirect HTTP to HTTPS (required for Let's Encrypt)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name motoexpert.proyectoscampus.top;

    # SSL Configuration - Use Certbot to generate these!
    ssl_certificate /etc/letsencrypt/live/motoexpert.proyectoscampus.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motoexpert.proyectoscampus.top/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Frontend and Backend Proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support for Service Tracking
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
